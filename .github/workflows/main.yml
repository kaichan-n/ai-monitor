name: AI Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: AI監視エージェントを実行
        run: python main.py
