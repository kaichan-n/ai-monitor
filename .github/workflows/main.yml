name: AI Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: AI監視エージェントを実行
        run: python main.py

      - name: 記憶をGitHubに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "新しい記憶はありません"
          else
            git commit -m "ニュース監視の記憶を更新"
            git push
          fi
